<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lago dos Estilos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@700;800&family=VT323&family=IM+Fell+English:ital@0;1&family=Tilt+Neon&family=Bangers&family=Caveat:wght@600&family=Press+Start+2P&display=swap">
<style>
  /* Layout: o lago ocupa a tela; placar no canto esquerdo, aba de estilos à direita (vira gaveta embaixo no celular). */
  :root {
    color-scheme: dark;
    --ground: #203319;
    --glass: rgba(16, 28, 20, 0.62);
    --glass-strong: rgba(12, 22, 16, 0.84);
    --glass-edge: rgba(236, 246, 214, 0.16);
    --key: rgba(236, 246, 214, 0.12);
    --hover: rgba(236, 246, 214, 0.08);
    --ink: #f3f0e2;
    --ink-soft: rgba(243, 240, 226, 0.74);
    --ink-faint: rgba(243, 240, 226, 0.5);
    --koi: #ffb25e;
    --koi-ink: #2b1a08;
    --osd: #f4f4f4;
    --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    --font-body: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-osd: "VT323", ui-monospace, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.4 var(--font-body); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #c2 { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .tag { font: 700 9.5px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--koi); white-space: nowrap; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .glass {
    background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 10px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .hud {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; gap: 12px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: calc(280px + env(safe-area-inset-right, 0px));
  }
  .brand { pointer-events: auto; padding: 11px 14px 12px; display: flex; flex-direction: column; gap: 6px; width: min(330px, 100%); }
  .brand h1 { margin: 0; font: 800 15px/1.1 var(--font-mono); letter-spacing: 0.06em; }
  .brand h1 span { color: var(--koi); }
  .now { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 16px; }
  .now b { font: 800 13px var(--font-mono); color: var(--koi-ink); background: var(--koi); border-radius: 5px; padding: 1px 6px; font-variant-numeric: tabular-nums; }
  .desc { margin: 0; color: var(--ink-soft); font-size: 13px; }
  .note { margin: 0; color: var(--koi); font-size: 12.5px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .score { font-size: 13px; color: var(--ink-soft); }
  .score b { display: inline-block; font: 700 14px var(--font-mono); color: var(--koi); font-variant-numeric: tabular-nums; }
  .score b.pop { animation: pop 0.45s ease-out; }
  @keyframes pop { from { transform: scale(1.7); } to { transform: scale(1); } }
  .size { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); }
  .size input { width: 104px; accent-color: var(--koi); }
  .hint { pointer-events: auto; margin: 0; padding: 8px 14px; font-size: 12.5px; color: var(--ink-soft); max-width: 100%; }
  .hint kbd { font: 700 11px var(--font-mono); color: var(--ink); background: var(--key); border-radius: 4px; padding: 1px 5px; }
  .touch { display: none; }
  @media (hover: none) and (pointer: coarse) { .desk { display: none; } .touch { display: inline; } }

  /* aba de estilos */
  .styles {
    position: fixed; z-index: 5;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    width: 248px; max-height: calc(100% - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; background: var(--glass-strong); overflow: hidden;
  }
  .styles-head {
    display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; cursor: pointer;
    padding: 11px 14px; font: 800 13px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; text-align: left;
  }
  .styles-head .count { color: var(--ink-faint); font-weight: 700; }
  .styles-head .chev { margin-left: auto; transition: transform 0.2s ease; }
  .styles.closed .chev { transform: rotate(-90deg); }
  .styles.closed .style-list { display: none; }
  .style-list { overflow-y: auto; padding: 0 8px 10px; border-top: 1px solid var(--glass-edge); overscroll-behavior: contain; }
  .style-list h2 { margin: 12px 6px 4px; font: 700 10.5px var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); }
  .style-btn {
    display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-radius: 7px; background: transparent;
    padding: 7px 8px; cursor: pointer; text-align: left; font-size: 13.5px; font-weight: 600;
  }
  .style-btn:hover { background: var(--hover); }
  .style-btn .n { flex: none; width: 24px; font: 700 11.5px var(--font-mono); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .style-btn[aria-pressed="true"] { background: var(--koi); color: var(--koi-ink); }
  .style-btn[aria-pressed="true"] .n, .style-btn[aria-pressed="true"] .tag { color: var(--koi-ink); }
  .style-btn .tag { margin-left: auto; }
  .style-btn:focus-visible, .styles-head:focus-visible, .size input:focus-visible { outline: 2px solid var(--koi); outline-offset: 2px; }

  /* tela de videocassete (só no estilo CRT) */
  .osd { position: fixed; inset: 0; pointer-events: none; font: 30px/1 var(--font-osd); color: var(--osd); text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6); }
  .osd span { position: absolute; }
  .osd .play { left: 9%; top: 18%; }
  .osd .time { right: calc(9% + 260px); bottom: 12%; }

  .fail { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 15px; color: var(--ink); background: var(--ground); }

  @media (max-width: 720px) {
    .hud { padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
    .styles { top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: auto; max-height: 58%; }
    .styles .style-list { order: -1; border-top: 0; border-bottom: 1px solid var(--glass-edge); }
    .osd .time { right: 9%; bottom: 22%; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .score b.pop { animation: none; } .styles-head .chev { transition: none; } }
</style>

<canvas id="c" aria-label="Um lago com um peixe nadando, desenhado em vários estilos de arte"></canvas>
<canvas id="c2" hidden aria-hidden="true"></canvas>
<div class="hud">
  <div class="glass brand">
    <h1><span>~</span> lago dos estilos <span>~</span></h1>
    <div class="now"><b id="styleNum">2</b><span id="styleName">ASCII</span><span class="tag" id="styleTag" hidden>arte própria</span></div>
    <p class="desc" id="styleDesc"></p>
    <p class="note" id="note" hidden></p>
    <div class="row">
      <span class="score">petiscos: <b id="score">0</b></span>
      <label class="size" id="sizeRow" for="cell">tamanho <input id="cell" type="range" min="5" max="18" step="1" value="9"></label>
    </div>
  </div>
  <p class="glass hint">
    <span class="desk"><kbd>W A S D</kbd> ou setas nadam · clique e segure para guiar · <kbd>Q</kbd> <kbd>E</kbd> trocam o estilo</span>
    <span class="touch">toque e segure no lago para guiar o peixe</span>
  </p>
</div>
<aside class="styles glass" id="styles" aria-label="Estilos de arte">
  <button class="styles-head" id="stylesToggle" type="button" aria-expanded="true" aria-controls="styleList">
    <span>Estilos</span><span class="count" id="styleCount"></span><span class="chev" aria-hidden="true">▾</span>
  </button>
  <div class="style-list" id="styleList"></div>
</aside>
<div class="osd" id="osd" hidden><span class="play">PLAY ▶</span><span class="time" id="osdTime"></span></div>
<div class="fail" id="fail" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';
  const failBox = document.getElementById('fail');
  const fail = (msg) => { failBox.textContent = msg; failBox.hidden = false; };
  const T = window.THREE;
  if (!T) { fail('Não deu para carregar o Three.js. Recarregue a página.'); return; }

  const canvas = document.getElementById('c');
  let renderer;
  try { renderer = new T.WebGLRenderer({ canvas, antialias: false, premultipliedAlpha: false, powerPreference: 'high-performance' }); }
  catch (e) { fail('Este navegador não liberou WebGL, então o lago não pode ser desenhado.'); return; }
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.setClearColor(0x4f8a3a, 0);

  // ---------- acaso com semente e ruído ----------
  function mulberry32(a) {
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(1026);
  const rr = (a, b) => a + (b - a) * rand();
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  function hash2(x, z) { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
  function vnoise(x, z) {
    const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
    const a = hash2(xi, zi), b = hash2(xi + 1, zi), c = hash2(xi, zi + 1), d = hash2(xi + 1, zi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const lerpAngle = (a, b, t) => { const d = Math.atan2(Math.sin(b - a), Math.cos(b - a)); return a + d * t; };

  // ---------- materiais ----------
  // Cada material escreve o número do seu "tipo" no canal alfa da cena.
  // Os filtros leem esse número para saber o que é água, peixe, folha...
  const G = { EMPTY: 0, GRASS: 1, LEAF: 2, WATER: 3, SAND: 4, STONE: 5, WOOD: 6, FISH: 7, BUBBLE: 8, LILY: 9, REED: 10, FLOWER: 11 };
  const box = new T.BoxGeometry(1, 1, 1);
  const idAlpha = (id) => (id * 16 + 8) / 255;
  const matCache = {};
  function mat(id, color = 0xffffff) {
    const k = id + ':' + color;
    return matCache[k] || (matCache[k] = new T.MeshLambertMaterial({ color, opacity: idAlpha(id), transparent: false }));
  }
  const col = (hex) => new T.Color(hex);
  const hsl = (h, s, l) => new T.Color().setHSL(h, s, l);
  function jit(c, amt) {
    const o = {}; c.getHSL(o);
    return new T.Color().setHSL(o.h + (rand() - 0.5) * amt * 0.15, o.s, clamp(o.l + (rand() - 0.5) * amt, 0, 1));
  }

  // ---------- forma do lago ----------
  const RX = 16, RZ = 10.5, WATER_Y = -0.3, FISH_Y = -0.85, FISH_LIMIT = 0.72, FISH_SIZE = 1.5;
  const lakeR = (a) => 1 + 0.10 * Math.sin(3 * a + 0.7) + 0.06 * Math.sin(5 * a + 2.1) + 0.035 * Math.sin(7 * a + 4.0);
  function lakeV(x, z) { const dx = x / RX, dz = z / RZ; return Math.hypot(dx, dz) / lakeR(Math.atan2(dz, dx)); }
  const polar = (a, k) => ({ x: RX * Math.cos(a) * k, z: RZ * Math.sin(a) * k });
  const bedTop = (v) => -0.9 - Math.round(3.0 * smooth((1 - v) / 0.32) / 0.35) * 0.35;

  const DOCK_A = -0.6, dockR = lakeR(DOCK_A);
  const dockLand = polar(DOCK_A, dockR * 1.18), dockEnd = polar(DOCK_A, dockR * 0.88);
  const LEFT_A = Math.PI + 0.25, leftShore = polar(LEFT_A, lakeR(LEFT_A) * 1.08);
  const PATHS = [
    [dockLand, { x: dockLand.x + 5, z: dockLand.z - 5 }, { x: 34, z: -18 }, { x: 50, z: -25 }],
    [leftShore, { x: leftShore.x - 6, z: leftShore.z + 3 }, { x: -36, z: 9 }, { x: -50, z: 14 }],
  ];
  function segDist(px, pz, a, b) {
    const vx = b.x - a.x, vz = b.z - a.z;
    const t = clamp(((px - a.x) * vx + (pz - a.z) * vz) / (vx * vx + vz * vz), 0, 1);
    return Math.hypot(px - a.x - vx * t, pz - a.z - vz * t);
  }
  function pathDist(x, z) {
    let m = Infinity;
    for (const p of PATHS) for (let i = 0; i < p.length - 1; i++) m = Math.min(m, segDist(x, z, p[i], p[i + 1]));
    return m;
  }
  const isPath = (x, z) => pathDist(x, z) < 0.85 + vnoise(x * 0.4, z * 0.4) * 0.5;
  function cellTop(x, z) {
    const cx = Math.floor(x) + 0.5, cz = Math.floor(z) + 0.5, v = lakeV(cx, cz);
    if (v < 1) return bedTop(v);
    if (v < 1.13) return -0.12;
    return isPath(cx, cz) ? -0.04 : 0;
  }

  // ---------- mundo de voxels ----------
  const scene = new T.Scene();
  const voxelWorld = new T.Group(), voxelTrees = new T.Group();
  scene.add(voxelWorld); voxelWorld.add(voxelTrees);
  const batches = new Map();
  const dummy = new T.Object3D();
  let addGroup = 'base';
  function add(id, x, y, z, sx, sy, sz, color, ry = 0, cast = true) {
    const key = addGroup + ':' + id + (cast ? 'c' : 'n');
    if (!batches.has(key)) batches.set(key, { id, cast, group: addGroup, items: [] });
    batches.get(key).items.push([x, y, z, sx, sy, sz, color, ry]);
  }
  const BOTTOM = -7;
  const column = (id, x, z, top, color) => add(id, x, (top + BOTTOM) / 2, z, 1, top - BOTTOM, 1, color);

  const X0 = -46, X1 = 46, Z0 = -40, Z1 = 30;
  const SAND_C = col(0xd9c690), DEEP_C = col(0x6aa392), PEBBLE_C = col(0x9b998c), SHORE_C = col(0xe4d29f), PATH_C = col(0xb8935f);
  for (let ix = X0; ix < X1; ix++) for (let iz = Z0; iz < Z1; iz++) {
    const x = ix + 0.5, z = iz + 0.5, v = lakeV(x, z);
    if (v < 1) {
      const s = smooth((1 - v) / 0.55);
      const c = rand() < 0.07 ? jit(PEBBLE_C, 0.12) : jit(SAND_C.clone().lerp(DEEP_C, s), 0.06);
      column(G.WATER, x, z, bedTop(v), c);
    } else if (v < 1.13) {
      column(G.SAND, x, z, -0.12, jit(SHORE_C, 0.05));
    } else if (isPath(x, z)) {
      column(G.SAND, x, z, -0.04, jit(PATH_C, 0.07));
    } else {
      const n1 = vnoise(x * 0.07, z * 0.07), n2 = vnoise(x * 0.31 + 19, z * 0.31 - 7);
      column(G.GRASS, x, z, 0, hsl(0.255 + n1 * 0.04, 0.36 + n2 * 0.07, 0.39 + n1 * 0.09 + n2 * 0.05 + (rand() - 0.5) * 0.025));
    }
  }

  // árvores (num grupo próprio, para o estilo L-system poder trocá-las)
  const trees = [];
  for (let tries = 0; trees.length < 60 && tries < 8000; tries++) {
    const x = Math.floor(rr(X0 + 3, X1 - 3)) + 0.5, z = Math.floor(rr(Z0 + 3, Z1 - 3)) + 0.5;
    if (lakeV(x, z) < (z > 0 ? 1.6 : 1.25) || pathDist(x, z) < 2.4) continue;
    if (trees.some(t => Math.hypot(t.x - x, t.z - z) < 3.8)) continue;
    trees.push({ x, z });
  }
  addGroup = 'tree';
  for (const t of trees) {
    const h = 2 + Math.floor(rand() * 2);
    add(G.WOOD, t.x, h / 2, t.z, 0.8, h, 0.8, jit(col(0x7a5132), 0.05));
    const R = 1.7 + rand() * 0.9, cy = h + R * 0.55, n = Math.ceil(R) + 1, hue = 0.23 + rand() * 0.07;
    for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) for (let k = -n; k <= n; k++) {
      const d = (i * i + k * k) / (R * R) + (j * j) / (R * R * 0.62);
      if (d > 1 + (rand() - 0.5) * 0.4 || d < 0.35) continue;
      add(G.LEAF, t.x + i, cy + j, t.z + k, 1, 1, 1, hsl(hue + (rand() - 0.5) * 0.02, 0.5, 0.33 + (j / n) * 0.09 + (rand() - 0.5) * 0.06));
    }
  }
  addGroup = 'base';

  // pedras na margem e na parte rasa
  const rocks = [];
  for (let placed = 0, tries = 0; placed < 18 && tries < 3000; tries++) {
    const a = rand() * Math.PI * 2, p = polar(a, lakeR(a) * rr(0.9, 1.5)), v = lakeV(p.x, p.z);
    if (v < 0.93 || pathDist(p.x, p.z) < 1.6 || segDist(p.x, p.z, dockLand, dockEnd) < 2.6) continue;
    placed++;
    const base = cellTop(p.x, p.z), wet = v < 1, parts = 1 + Math.floor(rand() * 3);
    rocks.push({ x: p.x, z: p.z, base, wet, s: 0.7 + parts * 0.25 });
    for (let j = 0; j < parts; j++) {
      const s = rr(0.6, 1.3) * (j ? 0.7 : 1);
      const top = wet ? WATER_Y + rr(0.15, 0.55) : base + rr(0.35, 1.0) * (j ? 0.6 : 1);
      const ox = j ? rr(-0.8, 0.8) : 0, oz = j ? rr(-0.8, 0.8) : 0;
      add(G.STONE, p.x + ox, (top + base - 0.3) / 2, p.z + oz, s, top - base + 0.3, s * rr(0.8, 1.2), jit(col(0xa7a59b), 0.12), rand() * Math.PI);
    }
  }

  // flores e tufos de grama
  const FLOWER_COLS = [0xfff8ec, 0xffe066, 0xff9ec4, 0xc9a7ff, 0xffffff];
  for (let placed = 0, tries = 0; placed < 170 && tries < 6000; tries++) {
    const x = rr(X0, X1), z = rr(Z0, Z1);
    if (cellTop(x, z) !== 0 || lakeV(x, z) < 1.2) continue;
    placed++;
    add(G.FLOWER, x, 0.14, z, 0.26, 0.26, 0.26, col(FLOWER_COLS[Math.floor(rand() * FLOWER_COLS.length)]), 0, false);
  }
  for (let placed = 0, tries = 0; placed < 280 && tries < 6000; tries++) {
    const x = rr(X0, X1), z = rr(Z0, Z1);
    if (cellTop(x, z) !== 0) continue;
    placed++;
    add(G.GRASS, x, 0.2, z, 0.16, 0.4, 0.16, hsl(0.26 + rand() * 0.04, 0.5, 0.3 + rand() * 0.12), rand() * 3, false);
  }

  // vitórias-régias
  const pads = [];
  for (let tries = 0; pads.length < 10 && tries < 3000; tries++) {
    const a = rand() * Math.PI * 2, p = polar(a, lakeR(a) * rr(0.3, 0.86));
    if (pads.some(q => Math.hypot(q.x - p.x, q.z - p.z) < 3.4) || segDist(p.x, p.z, dockLand, dockEnd) < 2.5) continue;
    pads.push(p);
  }
  pads.forEach((p, idx) => {
    const r = rr(0.85, 1.35), notch = rand() * Math.PI * 2, hue = 0.28 + (rand() - 0.5) * 0.04;
    p.r = r; p.flower = idx % 3 === 0;
    for (let i = -3; i <= 3; i++) for (let j = -3; j <= 3; j++) {
      const px = i * 0.45, pz = j * 0.45, d = Math.hypot(px, pz);
      if (d > r) continue;
      const ang = Math.atan2(pz, px) - notch;
      if (Math.abs(Math.atan2(Math.sin(ang), Math.cos(ang))) < 0.34 && d > 0.2) continue;
      add(G.LILY, p.x + px, WATER_Y + 0.07, p.z + pz, 0.46, 0.08, 0.46, hsl(hue, 0.48, 0.36 + (rand() - 0.5) * 0.07 + (d < 0.5 ? 0.04 : 0)));
    }
    if (p.flower) {
      const fx = p.x + 0.15, fz = p.z - 0.1;

  // ---------- pulso musical: música feita na hora, e o lago dança junto ----------
  const music = { ctx: null, on: false, timer: 0, next: 0, step: 0, beats: [], beat: 0, bass: 0, mid: 0, high: 0 };

  }

  // ======================================================================
  // ESTILOS COM ARTE PRÓPRIA: cada um desenha o próprio mundo, sem passar pelos voxels.

  // ---------- base 2D (vetorial e pixel art) ----------
  const c2 = document.getElementById('c2');
  const g2 = c2.getContext('2d');

  const r2 = mulberry32(2024);

  const FLOWER_HEX = [0xfffaf0, 0xffe066, 0xff9ec4, 0xc9a7ff];
  for (let n = 0, t = 0; n < 220 && t < 8000; t++) {
    const x = X0 + r2() * (X1 - X0), z = Z0 + r2() * (Z1 - Z0);
    if (cellTop(x, z) !== 0 || lakeV(x, z) < 1.2) continue;
    n++;

  }

  }
  for (let i = 0; i < 42; i++) {
    const a = r2() * Math.PI * 2, p = polar(a, Math.sqrt(r2()) * 0.9 * lakeR(a));

  }
  const treeLook = trees.map(() => ({ r: 1.5 + r2() * 0.9, pink: r2() < 0.15, a: r2() * 6, tone: r2() }));
  const rockLook = rocks.map(() => ({ k: Array.from({ length: 7 }, () => 0.75 + r2() * 0.35) }));
  const padLook = pads.map(() => r2() * Math.PI * 2);
  const hexStr = (h) => '#' + h.toString(16).padStart(6, '0');

  function lakeLoop(k, n = 160) {
    const pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, p = polar(a, lakeR(a) * k); pts.push({ x: p.x, y: p.z }); }
    return pts;
  }
  // curva suave fechada passando pelos pontos médios
  function smoothPath(pts, path = new Path2D()) {
    const n = pts.length, mid = (i) => ({ x: (pts[i % n].x + pts[(i + 1) % n].x) / 2, y: (pts[i % n].y + pts[(i + 1) % n].y) / 2 });
    const s = mid(0);
    path.moveTo(s.x, s.y);
    for (let i = 1; i <= n; i++) { const c = pts[i % n], e = mid(i); path.quadraticCurveTo(c.x, c.y, e.x, e.y); }
    path.closePath();
    return path;
  }
  const LAKE2 = {
    sand: smoothPath(lakeLoop(1.15)), wet: smoothPath(lakeLoop(1.05)), shore: smoothPath(lakeLoop(1.0)),
    b1: smoothPath(lakeLoop(0.82)), b2: smoothPath(lakeLoop(0.6)), b3: smoothPath(lakeLoop(0.38)),
  };

  // forma do peixe: uma espinha que ondula e uma largura que afina até a cauda
  const FISH_HEAD = 1.45, FISH_LEN = 2.7;
  const fishWidth = (u) => Math.max(0.6 * Math.pow(Math.sin(Math.PI * Math.pow(clamp(u, 0, 1), 0.65)), 0.9), 0.12 * u);
  const fishAmp = () => 0.12 + Math.min((F.speed || 0) / 7.5, 1) * 0.25;
  function fishWave(x, amp) {
    const d = FISH_HEAD - x;
    return Math.sin(F.phase - d * 1.6) * amp * Math.pow(clamp(d / FISH_LEN, 0, 1.4), 1.5);
  }

  let nextRing = 0;
  function ringsTick(dt) {
    if ((F.speed || 0) > 3.5 && time > nextRing) {
      rings2.push({ x: F.x, z: F.z, t: 0, big: 0.6 });
      nextRing = time + 0.45;
    }
    for (const r of rings2) r.t += dt;
    while (rings2.length && rings2[0].t > 1.3) rings2.shift();
  }
  function devXY(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return [(cx - r.left) * buf.x / r.width, (cy - r.top) * buf.y / r.height];
  }
  function follow2(dt) {
    const k = 1 - Math.exp(-2.2 * dt);
    view2.x += (F.x * 0.6 - view2.x) * k;
    view2.z += (F.z * 0.6 - view2.z) * k;
  }
  function twoDEnter(toWorld) {
    c2.width = buf.x; c2.height = buf.y;
    c2.hidden = false;
    screenToWorld = toWorld;
    view2.x = F.x * 0.6; view2.z = F.z * 0.6;
  }
  function twoDExit() { c2.hidden = true; screenToWorld = null; }

  // ---------- VETORIAL FLAT ----------
  function fishBody(amp) {
    const N = 18, S = [], L = [], R = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N, x = FISH_HEAD - u * FISH_LEN, y = fishWave(x, amp);
      const y2 = fishWave(x - 0.05, amp);
      let tx = 0.05, ty = y - y2;
      const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;
      const w = fishWidth(u);
      S.push({ x, y, tx, ty, w });
      L.push({ x: x - ty * w, y: y + tx * w });
      R.push({ x: x + ty * w, y: y - tx * w });
    }
    const outline = L.concat(R.slice().reverse());
    const body = new Path2D();
    body.moveTo(outline[0].x, outline[0].y);
    for (let i = 1; i < outline.length - 1; i++) {
      const c = outline[i], e = outline[i + 1];
      body.quadraticCurveTo(c.x, c.y, (c.x + e.x) / 2, (c.y + e.y) / 2);
    }
    body.closePath();
    const at = (u, side, k) => { const s = S[Math.round(u * N)]; return { x: s.x - s.ty * s.w * side * k, y: s.y + s.tx * s.w * side * k, a: Math.atan2(s.ty, s.tx) }; };
    return { N, S, body, at };
  }
  function flatFish(ctx) {
    const amp = fishAmp(), { N, S, body, at } = fishBody(amp);

    // cauda em leque
    const e = S[N], ta = Math.atan2(e.ty, e.tx) + Math.sin(F.phase - 1.1) * amp * 1.4;
    ctx.save();
    ctx.translate(e.x, e.y); ctx.rotate(ta);
    ctx.fillStyle = '#ffb27a';
    ctx.beginPath();
    ctx.moveTo(0.05, 0.1);
    ctx.quadraticCurveTo(-0.35, 0.75, -1.0, 0.8);
    ctx.quadraticCurveTo(-0.72, 0.32, -0.6, 0);
    ctx.quadraticCurveTo(-0.72, -0.32, -1.0, -0.8);
    ctx.quadraticCurveTo(-0.35, -0.75, 0.05, -0.1);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ffd2ad'; ctx.lineWidth = 0.045; ctx.lineCap = 'round';
    for (const [x, y] of [[-0.85, 0.55], [-0.7, 0.25], [-0.7, -0.25], [-0.85, -0.55]]) { ctx.beginPath(); ctx.moveTo(-0.05, 0); ctx.lineTo(x, y); ctx.stroke(); }
    ctx.restore();

    // nadadeiras do peito, batendo
    const flap = 0.65 + 0.35 * Math.sin(F.phase * 0.7);
    ctx.fillStyle = '#ffc59a';
    for (const side of [1, -1]) {
      const p = at(0.3, side, 0.85);
      ctx.beginPath();
      ctx.ellipse(p.x - 0.1, p.y + side * 0.18, 0.4, 0.17 * flap, p.a - side * 0.9, 0, Math.PI * 2);
      ctx.fill();
    }

    // corpo, com uma faixa mais clara no meio que dá volume
    ctx.fillStyle = '#ff7a2f'; ctx.fill(body);
    ctx.save();
    ctx.clip(body);
    ctx.fillStyle = '#ff9552';
    ctx.beginPath();
    S.forEach((s, i) => { const x = s.x - s.ty * s.w * 0.35, y = s.y + s.tx * s.w * 0.35; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    for (let i = N; i >= 0; i--) { const s = S[i]; ctx.lineTo(s.x + s.ty * s.w * 0.25, s.y - s.tx * s.w * 0.25); }
    ctx.fill();
    // manchas da carpa koi
    const spot = (u, off, rx, ry, color) => {
      const s = S[Math.round(u * N)];
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(s.x - s.ty * off, s.y + s.tx * off, rx, ry, Math.atan2(s.ty, s.tx), 0, Math.PI * 2);
      ctx.fill();
    };
    spot(0.17, 0.1, 0.4, 0.27, '#fff4e6');
    spot(0.37, -0.06, 0.3, 0.2, '#e5431f');
    spot(0.56, -0.12, 0.46, 0.3, '#fff4e6');
    spot(0.8, 0.05, 0.22, 0.12, '#e5431f');
    ctx.restore();
    ctx.strokeStyle = '#d9541f'; ctx.lineWidth = 0.05; ctx.stroke(body);
    // olhos
    for (const side of [1, -1]) {
      const p = at(0.06, side, 0.62);
      ctx.fillStyle = '#2a2230'; ctx.beginPath(); ctx.arc(p.x, p.y, 0.075, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(p.x + 0.025, p.y - 0.02, 0.025, 0, Math.PI * 2); ctx.fill();
    }
  }

  function blobPath(ctx, x, z, r, k) {
    const pts = k.map((m, i) => { const a = i / k.length * Math.PI * 2; return { x: x + Math.cos(a) * r * m, y: z + Math.sin(a) * r * m }; });
    ctx.beginPath();
    smoothPath(pts, ctx);
  }

  function flatRender(dt) {
    follow2(dt); ringsTick(dt);
    const W = buf.x, H = buf.y, ctx = g2, TAU = Math.PI * 2;
    view2.s = W / (aspect >= 1 ? 40 : 24);
    const s = view2.s;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#9fd468'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(s, 0, 0, s, W / 2 - view2.x * s, H / 2 - view2.z * s);
    const vx0 = view2.x - W / 2 / s - 4, vx1 = view2.x + W / 2 / s + 4, vz0 = view2.z - H / 2 / s - 4, vz1 = view2.z + H / 2 / s + 4;
    const vis = (x, z) => x > vx0 && x < vx1 && z > vz0 && z < vz1;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    for (const b of blobs2) if (vis(b.x, b.z)) { ctx.fillStyle = b.c; ctx.beginPath(); ctx.ellipse(b.x, b.z, b.rx, b.rz, b.a, 0, TAU); ctx.fill(); }
    for (const p of PATHS) {
      ctx.beginPath(); ctx.moveTo(p[0].x, p[0].z);
      for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].z);
      ctx.strokeStyle = '#e3c486'; ctx.lineWidth = 2.3; ctx.stroke();
      ctx.strokeStyle = '#efd7a2'; ctx.lineWidth = 1.4; ctx.stroke();
    }
    // lago em faixas de profundidade
    ctx.fillStyle = '#f6e2a8'; ctx.fill(LAKE2.sand);
    ctx.fillStyle = '#e8cf8e'; ctx.fill(LAKE2.wet);
    ctx.fillStyle = '#8fe3dc'; ctx.fill(LAKE2.shore);
    ctx.fillStyle = '#66d0d4'; ctx.fill(LAKE2.b1);
    ctx.fillStyle = '#45bccb'; ctx.fill(LAKE2.b2);
    ctx.fillStyle = '#34a7bd'; ctx.fill(LAKE2.b3);
    // embaixo d'água: algas, sombra, ração, peixe, bolhas
    ctx.strokeStyle = '#2f9a8a'; ctx.lineWidth = 0.2;
    for (const w of weeds) {
      const sw = Math.sin(time * 0.9 + w.ph) * 0.35;
      ctx.beginPath(); ctx.moveTo(w.x, w.z); ctx.quadraticCurveTo(w.x + sw * 0.5, w.z - w.h * 0.4, w.x + sw, w.z - w.h * 0.75); ctx.stroke();
    }
    ctx.save();
    ctx.translate(F.x + 0.6, F.z + 0.8); ctx.rotate(-F.heading);
    ctx.fillStyle = 'rgba(20, 80, 100, 0.22)';
    ctx.beginPath(); ctx.ellipse(-0.3 * FISH_SIZE, 0, 2.0 * FISH_SIZE, 0.6 * FISH_SIZE, 0, 0, TAU); ctx.fill();
    ctx.restore();
    for (const f of foods) if (f.on) {
      ctx.fillStyle = '#e0892a'; ctx.beginPath(); ctx.arc(f.x, f.z, 0.22, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffc06a'; ctx.beginPath(); ctx.arc(f.x - 0.06, f.z - 0.06, 0.09, 0, TAU); ctx.fill();
    }
    ctx.save();
    ctx.translate(F.x, F.z); ctx.rotate(-F.heading); ctx.scale(FISH_SIZE, FISH_SIZE);
    flatFish(ctx);
    ctx.restore();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)'; ctx.lineWidth = 0.06;
    for (const b of bubbles) if (b.on) { ctx.beginPath(); ctx.arc(b.x, b.z, b.s * 0.9, 0, TAU); ctx.stroke(); }
    // brilhos e ondinhas na superfície
    ctx.save();
    ctx.clip(LAKE2.shore);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.12;
    for (const g of glints2) {
      const a = Math.sin(time * 1.3 + g.ph);
      if (a < 0.2) continue;
      ctx.globalAlpha = (a - 0.2) / 0.8 * 0.6;
      const dx = Math.sin(time * 0.5 + g.ph) * 0.4;
      ctx.beginPath(); ctx.moveTo(g.x - g.len / 2 + dx, g.z); ctx.quadraticCurveTo(g.x + dx, g.z - 0.2, g.x + g.len / 2 + dx, g.z); ctx.stroke();
    }
    for (const r of rings2) {
      ctx.globalAlpha = Math.max(0, 1 - r.t / 1.3) * 0.7;
      ctx.beginPath(); ctx.arc(r.x, r.z, 0.3 + r.t * 2.2 * r.big, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)'; ctx.lineWidth = 0.14;
    ctx.setLineDash([0.8, 0.6]); ctx.lineDashOffset = -time * 0.6;
    ctx.stroke(LAKE2.shore);
    ctx.setLineDash([]);
    // pedras
    rocks.forEach((r, i) => {
      if (!vis(r.x, r.z)) return;
      const k = rockLook[i].k, rad = r.s * 0.75;
      ctx.fillStyle = 'rgba(30, 60, 40, 0.18)'; blobPath(ctx, r.x + 0.25, r.z + 0.3, rad, k); ctx.fill();
      ctx.fillStyle = '#aaa6bd'; blobPath(ctx, r.x, r.z, rad, k); ctx.fill();
      ctx.fillStyle = '#d4d1e1'; blobPath(ctx, r.x - rad * 0.18, r.z - rad * 0.2, rad * 0.6, k); ctx.fill();
    });
    // vitórias-régias
    pads.forEach((p, i) => {
      const n = padLook[i];
      ctx.fillStyle = 'rgba(20, 80, 90, 0.2)';
      ctx.beginPath(); ctx.arc(p.x + 0.15, p.z + 0.2, p.r, 0, TAU); ctx.fill();
      ctx.fillStyle = '#5fbf6a';
      ctx.beginPath(); ctx.moveTo(p.x, p.z); ctx.arc(p.x, p.z, p.r, n + 0.35, n - 0.35 + TAU); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#4aa858'; ctx.lineWidth = 0.06;
      for (let k = 1; k <= 5; k++) {
        const a = n + 0.35 + k / 6 * (TAU - 0.7);
        ctx.beginPath(); ctx.moveTo(p.x, p.z); ctx.lineTo(p.x + Math.cos(a) * p.r * 0.8, p.z + Math.sin(a) * p.r * 0.8); ctx.stroke();
      }
      if (p.flower) {
        ctx.fillStyle = '#ff8fbf';
        for (let k = 0; k < 6; k++) { const a = k / 6 * TAU + time * 0.1; ctx.beginPath(); ctx.ellipse(p.x + Math.cos(a) * 0.25, p.z + Math.sin(a) * 0.25, 0.24, 0.12, a, 0, TAU); ctx.fill(); }
        ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(p.x, p.z, 0.13, 0, TAU); ctx.fill();
      }
    });
    // juncos
    for (const r of reeds) {
      const sw = Math.sin(time * 1.3 + r.ph) * 0.15, tx = r.x + sw * r.h, tz = r.z - r.h * 0.35;
      ctx.strokeStyle = '#4c9a4a'; ctx.lineWidth = r.w * 0.9;
      ctx.beginPath(); ctx.moveTo(r.x, r.z); ctx.lineTo(tx, tz); ctx.stroke();
      if (r.head) { ctx.fillStyle = '#8a5530'; ctx.beginPath(); ctx.ellipse(tx, tz, 0.09, 0.22, sw, 0, TAU); ctx.fill(); }
    }
    // píer
    ctx.save();
    ctx.translate(dockLand.x, dockLand.z); ctx.rotate(Math.atan2(dock.uz, dock.ux));
    ctx.fillStyle = 'rgba(20, 60, 60, 0.2)'; ctx.fillRect(0.2, -0.95, dock.len, 2.3);
    for (let d = 0, n = 0; d <= dock.len; d += 0.56, n++) { ctx.fillStyle = n % 2 ? '#c98d5a' : '#b97d4c'; ctx.fillRect(d - 0.25, -1.15, 0.5, 2.3); }
    ctx.fillStyle = '#7a4c2b';
    for (const d of [0.4, dock.len * 0.5, dock.len - 0.2]) for (const side of [-1, 1]) { ctx.beginPath(); ctx.arc(d, side * 1.0, 0.16, 0, TAU); ctx.fill(); }
    ctx.restore();
    // flores
    for (const f of flowers2) {
      if (!vis(f.x, f.z)) continue;
      ctx.fillStyle = hexStr(f.c);
      for (let k = 0; k < 5; k++) { const a = f.a + k / 5 * TAU; ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * f.s, f.z + Math.sin(a) * f.s, f.s * 0.75, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#ffcf3f'; ctx.beginPath(); ctx.arc(f.x, f.z, f.s * 0.6, 0, TAU); ctx.fill();
    }
    // árvores vistas de cima, por cima de tudo
    trees.forEach((t, i) => {
      if (!vis(t.x, t.z)) return;
      const L = treeLook[i], r = L.r;
      const pal = L.pink ? ['#d9799c', '#f0a3bf', '#ffd0df'] : L.tone < 0.5 ? ['#3f9a52', '#4fae5c', '#7bd47b'] : ['#3a8f5a', '#4aa868', '#7ccf86'];
      ctx.fillStyle = 'rgba(30, 70, 30, 0.2)';
      ctx.beginPath(); ctx.ellipse(t.x + 0.9, t.z + 1.1, r * 1.05, r * 0.85, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = pal[0]; ctx.beginPath(); ctx.arc(t.x, t.z, r, 0, TAU); ctx.fill();
      for (let k = 0; k < 6; k++) { const a = L.a + k / 6 * TAU; ctx.beginPath(); ctx.arc(t.x + Math.cos(a) * r * 0.78, t.z + Math.sin(a) * r * 0.78, r * 0.35, 0, TAU); ctx.fill(); }
      ctx.fillStyle = pal[1]; ctx.beginPath(); ctx.arc(t.x - r * 0.18, t.z - r * 0.2, r * 0.78, 0, TAU); ctx.fill();
      ctx.fillStyle = pal[2]; ctx.beginPath(); ctx.arc(t.x - r * 0.42, t.z - r * 0.45, r * 0.32, 0, TAU); ctx.fill();
    });
  }
  const flatToWorld = (cx, cy) => {
    const [x, y] = devXY(cx, cy);
    return { x: view2.x + (x - buf.x / 2) / view2.s, z: view2.z + (y - buf.y / 2) / view2.s };
  };

  // ---------- PIXEL ART ----------
  const PIX = 4;   // pixels de arte por unidade do mundo
  const pix = {};
  function pixInit() {
    if (pix.ground) return true;
    const ww = (X1 - X0) * PIX, wh = (Z1 - Z0) * PIX;
    const mk = () => { const c = document.createElement('canvas'); c.width = ww; c.height = wh; return c; };
    pix.ground = mk(); pix.over = mk();
    pix.S = 4; pix.ox = 0; pix.oy = 0;
    const gi = pix.ground.getContext('2d').createImageData(ww, wh), oi = pix.over.getContext('2d').createImageData(ww, wh);
    const put = (img, x, y, hex) => {
      if (x < 0 || y < 0 || x >= ww || y >= wh) return;
      const o = (y * ww + x) * 4;
      img.data[o] = hex >> 16; img.data[o + 1] = (hex >> 8) & 255; img.data[o + 2] = hex & 255; img.data[o + 3] = 255;
    };
    const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const rp = mulberry32(31);
    const toPx = (x, z) => [Math.round((x - X0) * PIX), Math.round((z - Z0) * PIX)];
    const WATER4 = [0x7fd8d0, 0x4dbfc6, 0x2f9db3, 0x237f9e];
    for (let y = 0; y < wh; y++) for (let x = 0; x < ww; x++) {
      const wx = X0 + (x + 0.5) / PIX, wz = Z0 + (y + 0.5) / PIX, v = lakeV(wx, wz), b = B4[(y & 3) * 4 + (x & 3)] / 16;
      let c;
      if (v < 1) {
        if (v > 0.975) c = 0xe9fbf6;
        else { c = WATER4[Math.floor(clamp((1 - v) / 0.62 * 3 + (b - 0.5) * 0.7, 0, 3.99))]; if (rp() < 0.012) c = 0x9ee6dc; }
      } else if (v < 1.05) c = rp() < 0.08 ? 0xd4b676 : 0xe4c98a;
      else if (v < 1.15) c = rp() < 0.06 ? 0xe0c486 : 0xf2dca0;
      else if (isPath(wx, wz)) { const n = rp(); c = n < 0.08 ? 0xc49a5f : n < 0.14 ? 0xe7c891 : 0xd9b277; }
      else {
        const n = vnoise(wx * 0.25, wz * 0.25) + (b - 0.5) * 0.15;
        c = n < 0.35 ? 0x5aa83f : n > 0.7 ? 0x82cf57 : 0x6cbf4a;
        const q = rp();
        if (q < 0.05) c = 0x4e9a38; else if (q < 0.075) c = 0x9be06a;
      }
      put(gi, x, y, c);
    }
    // sombras das árvores no chão
    trees.forEach((t, i) => {
      const R = treeLook[i].r * PIX, [cx, cy] = toPx(t.x + 0.9, t.z + 1.1);
      for (let y = -R; y <= R; y++) for (let x = -R; x <= R; x++) {
        if (x * x + y * y * 1.4 > R * R) continue;
        const wx = X0 + (cx + x + 0.5) / PIX, wz = Z0 + (cy + y + 0.5) / PIX;
        if (lakeV(wx, wz) > 1.15 && !isPath(wx, wz)) put(gi, cx + x, cy + y, 0x4d9636);
      }
    });
    // flores (um sinalzinho de + de pixels)
    for (const f of flowers2) {
      const [x, y] = toPx(f.x, f.z);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) put(gi, x + dx, y + dy, f.c);
      put(gi, x, y, 0xffcf3f);
    }
    // forma redonda com contorno de 1 pixel e luz no canto de cima
    function sprite(img, cx, cy, R, wob, inside, cols) {
      const r0 = Math.ceil(R * 1.2) + 1;
      const isIn = (x, y) => { const d = Math.hypot(x, y), a = Math.atan2(y, x); return d < R * (1 + wob(a)) && inside(x, y); };
      for (let y = -r0; y <= r0; y++) for (let x = -r0; x <= r0; x++) {
        if (!isIn(x, y)) continue;
        const edge = !isIn(x + 1, y) || !isIn(x - 1, y) || !isIn(x, y + 1) || !isIn(x, y - 1);
        let c = cols.body;
        if (edge) c = cols.out;
        else if (Math.hypot(x + R * 0.45, y + R * 0.45) < R * 0.2) c = cols.hi;
        else if (Math.hypot(x + R * 0.3, y + R * 0.3) < R * 0.6) c = cols.light;
        put(img, cx + x, cy + y, c);
      }
    }
    rocks.forEach((r, i) => {
      const [cx, cy] = toPx(r.x, r.z), k = rockLook[i].k;
      sprite(gi, cx, cy, r.s * 0.75 * PIX, (a) => (k[Math.floor(((a + Math.PI) / (Math.PI * 2)) * 7) % 7] - 0.9) * 0.5, () => true,

      s.t = 0; s.spin = (Math.random() - 0.5) * 12;

    celWaterMat.uniforms.uTime.value = time;
    for (const s of cel.stars) {
      if (s.t >= 0.9) { s.m.visible = false; continue; }
      s.t += dt;
      s.v.y -= 9 * dt;
      s.m.position.addScaledVector(s.v, dt);
      s.m.quaternion.copy(camera.quaternion);

  // ======================================================================
  // FORA DA CAIXA: mais estilos com mundo próprio
  // ======================================================================
  const TAU = Math.PI * 2;
  function toWorld2D() { const s = view2.s; g2.setTransform(s, 0, 0, s, buf.x / 2 - view2.x * s, buf.y / 2 - view2.z * s); }
  // limpa a tela 2D, segue o peixe e devolve um teste "está na tela?"
  function begin2D(dt, bg) {
    follow2(dt); ringsTick(dt);
    view2.s = buf.x / (aspect >= 1 ? 40 : 24);
    const s = view2.s;
    g2.setTransform(1, 0, 0, 1, 0, 0);
    g2.globalAlpha = 1; g2.shadowBlur = 0; g2.setLineDash([]); g2.globalCompositeOperation = 'source-over';
    if (bg) { g2.fillStyle = bg; g2.fillRect(0, 0, buf.x, buf.y); }

    const vis = (x, z, m = 4) => x > x0 - m && x < x1 + m && z > z0 - m && z < z1 + m;

  }
  const toScreen2D = (x, z) => [(x - view2.x) * view2.s + buf.x / 2, (z - view2.z) * view2.s + buf.y / 2];

    const [sx, sy] = toScreen2D(x, z);

    if (rot) g2.rotate(rot);
    g2.font = font.replace('#', Math.round(size * DPR) + 'px');
    g2.fillStyle = color; g2.textAlign = align; g2.textBaseline = 'middle';

    g2.restore();

  function tile(w, h, draw) {
    const c = document.createElement('canvas');

  }
  // grão de papel que se repete
  function grain(alphaMax, seed) {
    return tile(256, 256, (x, w, h) => {
      const img = x.createImageData(w, h), r = mulberry32(seed);
      for (let i = 0; i < w * h; i++) {
        const v = r(), o = i * 4;
        img.data[o] = img.data[o + 1] = img.data[o + 2] = v < 0.5 ? 0 : 255;
        img.data[o + 3] = Math.abs(v - 0.5) * 2 * alphaMax * 255;

    ctx.save();

  }
  // converte um deslocamento do mundo para as coordenadas locais do peixe (para sombras)
  function fishLocalOffset(ox, oz) {

  }
  function polyline(ctx, p) { ctx.beginPath(); ctx.moveTo(p[0].x, p[0].z); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i].x, p[i].z); }
  function fishTailPath(ctx, S, N, amp) {
    const e = S[N], ta = Math.atan2(e.ty, e.tx) + Math.sin(F.phase - 1.1) * amp * 1.4;

  // ---------- NANQUIM JAPONÊS (sumi-e) ----------
  const INK = (a) => `rgba(24, 22, 28, ${a})`;
  const sumiShore = [];
  (() => {
    const r = mulberry32(7);
    for (let i = 0; i < 7; i++) {
      const a0 = r() * TAU, len = 0.5 + r() * 0.7, pts = [];
      for (let k = 0; k <= 14; k++) { const a = a0 + len * k / 14, p = polar(a, lakeR(a) * (1 + (r() - 0.5) * 0.015)); pts.push({ x: p.x, y: p.z }); }
      sumiShore.push(pts);
    }
  })();
  // pincelada: uma fita que começa grossa e termina afinando
  function brush(ctx, pts, w0, w1, seed) {
    const n = pts.length;
    if (n < 2) return;
    const Lp = [], Rp = [];
    for (let i = 0; i < n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      let tx = b.x - a.x, ty = b.y - a.y;
      const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
      const t = i / (n - 1);
      const w = (w0 + (w1 - w0) * t) * (0.8 + 0.4 * hash2(i * 1.7 + seed, seed * 3.1)) * Math.min(1, (1 - t) * 5 + 0.15) * (0.55 + 0.45 * Math.min(1, t * 6));
      Lp.push(pts[i].x - ty * w / 2, pts[i].y + tx * w / 2);
      Rp.push(pts[i].x + ty * w / 2, pts[i].y - tx * w / 2);
    }
    ctx.beginPath();
    ctx.moveTo(Lp[0], Lp[1]);
    for (let i = 2; i < Lp.length; i += 2) ctx.lineTo(Lp[i], Lp[i + 1]);
    for (let i = Rp.length - 2; i >= 0; i -= 2) ctx.lineTo(Rp[i], Rp[i + 1]);
    ctx.closePath();
    ctx.fill();
  }
  function sumiRender(dt) {
    const vis = begin2D(dt, '#f1e9d6'), ctx = g2;

    for (const p of [LAKE2.shore, LAKE2.b1, LAKE2.b2, LAKE2.b3]) ctx.fill(p);
    ctx.fillStyle = INK(0.82);
    sumiShore.forEach((pts, i) => brush(ctx, pts, 0.42, 0.1, i + 1));
    ctx.strokeStyle = INK(0.35); ctx.lineWidth = 0.05; ctx.lineCap = 'round';
    for (const g of glints2) {
      const a = Math.sin(time * 0.8 + g.ph);
      if (a < 0) continue;
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.moveTo(g.x - g.len / 2, g.z); ctx.quadraticCurveTo(g.x, g.z - 0.25, g.x + g.len / 2, g.z); ctx.stroke();

    pads.forEach((p, i) => {
      const n = padLook[i];
      ctx.fillStyle = 'rgba(70, 90, 70, 0.2)';
      ctx.beginPath(); ctx.moveTo(p.x, p.z); ctx.arc(p.x, p.z, p.r, n + 0.35, n - 0.35 + TAU); ctx.closePath(); ctx.fill();
      const pts = [];
      for (let k = 0; k <= 12; k++) { const a = n + 0.5 + k / 12 * (TAU - 1.2); pts.push({ x: p.x + Math.cos(a) * p.r, y: p.z + Math.sin(a) * p.r }); }
      ctx.fillStyle = INK(0.6); brush(ctx, pts, 0.12, 0.03, i * 7 + 3);
      if (p.flower) {
        ctx.fillStyle = 'rgba(200, 50, 40, 0.75)';
        for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; ctx.beginPath(); ctx.ellipse(p.x + Math.cos(a) * 0.22, p.z + Math.sin(a) * 0.22, 0.2, 0.09, a, 0, TAU); ctx.fill(); }
      }
    });

      const sw = Math.sin(time * 1.3 + r.ph) * 0.25, pts = [];
      for (let k = 0; k <= 6; k++) { const t = k / 6; pts.push({ x: r.x + sw * t * t * r.h * 0.5, y: r.z - t * r.h * 0.6 }); }

  }

  // ---------- PLANTA TÉCNICA ----------
  const BP = '#1d4e89', BPL = (a) => `rgba(232, 241, 255, ${a})`;
  const MONO = '700 # "JetBrains Mono", ui-monospace, monospace';
  const UNIT = 0.25;   // 1 unidade do jogo = 25 cm
  const fmt = (v) => (v * UNIT).toFixed(1).replace('.', ',');
  function blueRender(dt) {
    const vis = begin2D(dt, BP), ctx = g2, lp = DPR / view2.s;

    for (let x = Math.floor(bx0); x <= Math.ceil(bx1); x++) { ctx.strokeStyle = BPL(x % 5 === 0 ? 0.22 : 0.08); ctx.beginPath(); ctx.moveTo(x, bz0); ctx.lineTo(x, bz1); ctx.stroke(); }

  // ---------- MAPA ANTIGO ----------

      const r = mulberry32(5);
      for (let i = 0; i < 26; i++) {
        const cx = r() * w, cy = r() * h, rad = 30 + r() * 110;
        for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) {

          g.addColorStop(0, 'rgba(120, 80, 30, 0.10)'); g.addColorStop(1, 'rgba(120, 80, 30, 0)');

    ctx.lineCap = ctx.lineJoin = 'round';

    ctx.fillStyle = '#d8bf8a'; ctx.fillRect(-0.25, -1.15, dock.len + 0.5, 2.3);
    ctx.strokeStyle = INKM(0.9); ctx.lineWidth = 1.2 * lp; ctx.strokeRect(-0.25, -1.15, dock.len + 0.5, 2.3);
    ctx.lineWidth = 0.8 * lp; ctx.beginPath(); for (let d = 0.31; d < dock.len; d += 0.56) { ctx.moveTo(d, -1.15); ctx.lineTo(d, 1.15); } ctx.stroke();
    ctx.restore();

      ctx.strokeStyle = INKM(0.8); ctx.lineWidth = lp;

    });
    label('Lago dos Estilos', 0, lakeBox.z0 - 2.4, 26, FELL, INKM(0.95));
    label('aqui há peixes', F.x, F.z - 2.6 * FISH_SIZE, 14, FELL, INKM(0.9));
    label('Píer Velho', dockEnd.x + 1.5, dockEnd.z - 2.2, 13, FELL, INKM(0.85));

    g2.setTransform(1, 0, 0, 1, 0, 0);

    for (let k = 0; k < 8; k++) {

    g2.fillText('N', cx, cy - R - 12 * DPR);

  // ---------- PAPEL RECORTADO ----------
  function paperLake(k, seed) {
    const pts = [];
    for (let i = 0; i < 140; i++) {
      const a = i / 140 * TAU, p = polar(a, lakeR(a) * k * (1 + 0.012 * Math.sin(a * 13 + seed) + 0.006 * Math.sin(a * 29 + seed * 2)));
      pts.push({ x: p.x, y: p.z });
    }
    return smoothPath(pts);
  }

  // folha de papel: sombra deslocada (sem desfoque, como recorte de verdade) e depois a cor
  function pp(ctx, build, color, ox = 0.16, oz = 0.22, rule) {
    ctx.save();
    ctx.translate(ox, oz); ctx.fillStyle = 'rgba(40, 28, 12, 0.2)'; build(); ctx.fill(rule || 'nonzero');
    ctx.translate(-ox * 0.45, -oz * 0.45); ctx.fillStyle = 'rgba(40, 28, 12, 0.12)'; build(); ctx.fill(rule || 'nonzero');
    ctx.restore();
    ctx.fillStyle = color; build(); ctx.fill(rule || 'nonzero');
  }
  function paperRender(dt) {
    const vis = begin2D(dt, '#1d6584'), ctx = g2;

    const sheet = (i) => {
      const p = new Path2D();
      p.rect(x0 - 3, z0 - 3, x1 - x0 + 6, z1 - z0 + 6);
      p.addPath(PAPER[i].path);
      ctx.save(); ctx.translate(0.22, 0.3); ctx.fillStyle = 'rgba(10, 30, 40, 0.28)'; ctx.fill(p, 'evenodd');
      ctx.translate(-0.12, -0.16); ctx.fillStyle = 'rgba(10, 30, 40, 0.18)'; ctx.fill(p, 'evenodd'); ctx.restore();
      ctx.fillStyle = PAPER[i].c; ctx.fill(p, 'evenodd');
    };
    sheet(0); sheet(1); sheet(2);
    // embaixo da folha de areia: ração, peixe, bolhas e vitórias-régias
    for (const f of foods) if (f.on) pp(ctx, () => { ctx.beginPath(); ctx.arc(f.x, f.z, 0.2, 0, TAU); }, '#f3a23a', 0.06, 0.08);
    const [sx, sz] = fishLocalOffset(0.25, 0.35);
    inFish(ctx, () => {
      const amp = fishAmp(), { N, S, body, at } = fishBody(amp);
      pp(ctx, () => fishTailPath(ctx, S, N, amp), '#ffb070', sx, sz);
      for (const sg of [1, -1]) {
        const p = at(0.3, sg, 0.85);
        pp(ctx, () => { ctx.beginPath(); ctx.ellipse(p.x - 0.1, p.y + sg * 0.18, 0.4, 0.17, p.a - sg * 0.9, 0, TAU); }, '#ffc59a', sx * 0.6, sz * 0.6);
      }
      pp(ctx, () => { ctx.beginPath(); ctx.rect(-9, -9, 0, 0); }, '#000', 0, 0);
      ctx.save(); ctx.translate(sx, sz); ctx.fillStyle = 'rgba(10, 30, 40, 0.3)'; ctx.fill(body); ctx.restore();
      ctx.fillStyle = '#ff7a2f'; ctx.fill(body);
      ctx.save(); ctx.clip(body);
      for (const [u, off, rx, ry, c] of [[0.17, 0.1, 0.4, 0.27, '#fff1de'], [0.37, -0.06, 0.3, 0.2, '#e5431f'], [0.56, -0.12, 0.46, 0.3, '#fff1de']]) {
        const s = S[Math.round(u * N)];
        pp(ctx, () => { ctx.beginPath(); ctx.ellipse(s.x - s.ty * off, s.y + s.tx * off, rx, ry, Math.atan2(s.ty, s.tx), 0, TAU); }, c, sx * 0.3, sz * 0.3);
      }

    });

    pads.forEach((p, i) => {
      const n = padLook[i] + Math.sin(time * 0.6 + i) * 0.08;
      pp(ctx, () => { ctx.beginPath(); ctx.moveTo(p.x, p.z); ctx.arc(p.x, p.z, p.r, n + 0.35, n - 0.35 + TAU); ctx.closePath(); }, '#63c46f');
      if (p.flower) for (let k = 0; k < 6; k++) {
        const a = k / 6 * TAU + 0.3;
        pp(ctx, () => { ctx.beginPath(); ctx.ellipse(p.x + Math.cos(a) * 0.22, p.z + Math.sin(a) * 0.22, 0.24, 0.12, a, 0, TAU); }, k % 2 ? '#ff9fc6' : '#ff7fb3', 0.05, 0.07);
      }

    ctx.restore();
    for (const f of flowers2) {
      if (!vis(f.x, f.z)) continue;
      pp(ctx, () => { ctx.beginPath(); ctx.arc(f.x, f.z, f.s * 1.3, 0, TAU); }, hexStr(f.c), 0.05, 0.07);
    }
    trees.forEach((t, i) => {
      if (!vis(t.x, t.z)) return;
      const L = treeLook[i], r = L.r;
      const pal = L.pink ? ['#d9799c', '#f0a3bf', '#ffd0df'] : ['#3f8f4f', '#56aa5f', '#7ccb76'];
      pp(ctx, () => { ctx.beginPath(); ctx.arc(t.x, t.z, r, 0, TAU); }, pal[0], 0.3, 0.42);
      pp(ctx, () => { ctx.beginPath(); ctx.arc(t.x - r * 0.15, t.z - r * 0.18, r * 0.72, 0, TAU); }, pal[1], 0.18, 0.25);
      pp(ctx, () => { ctx.beginPath(); ctx.arc(t.x - r * 0.3, t.z - r * 0.34, r * 0.4, 0, TAU); }, pal[2], 0.1, 0.14);
    });
    overlay(pattern('paper3', () => grain(0.1, 41)));
  }

  // ---------- LETREIRO NEON ----------
  const NEON = {
    cyan: ['#25d9ff', '#d2f8ff'], blue: ['#3a7bff', '#d6e3ff'], pink: ['#ff3fa4', '#ffd6ec'], orange: ['#ff7a2f', '#ffe3cf'],
    green: ['#3dff7a', '#d6ffe4'], purple: ['#a66bff', '#ebe0ff'], yellow: ['#ffd23f', '#fff6cc'],
  };
  function brickTile() {
    return tile(120 * DPR, 60 * DPR, (x, w, h) => {
      x.fillStyle = '#100d14'; x.fillRect(0, 0, w, h);
      const bw = w / 2, bh = h / 2, m = 3 * DPR, r = mulberry32(3);
      for (let row = 0; row < 2; row++) for (let i = -1; i < 3; i++) {
        const v = 24 + Math.floor(r() * 10), ox = row ? bw / 2 : 0;
        x.fillStyle = `rgb(${v + 6}, ${v - 2}, ${v + 12})`;
        x.fillRect(i * bw + ox + m / 2, row * bh + m / 2, bw - m, bh - m);
      }
    });
  }
  const flick = (seed) => (hash2(Math.floor(time * 14), seed) > 0.985 ? 0.25 : 1);
  // tubo de neon: brilho largo e borrado por baixo, núcleo quase branco por cima
  function tube(ctx, shape, col, w, f = 1) {
    ctx.save();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const draw = () => { if (shape instanceof Path2D) ctx.stroke(shape); else { shape(); ctx.stroke(); } };
    ctx.shadowColor = col[0]; ctx.shadowBlur = 16 * DPR;
    ctx.strokeStyle = col[0]; ctx.globalAlpha = 0.5 * f; ctx.lineWidth = w * 2.4; draw();
    ctx.shadowBlur = 5 * DPR; ctx.globalAlpha = f; ctx.lineWidth = w; ctx.strokeStyle = col[1]; draw();
    ctx.restore();
  }
  function neonRender(dt) {
    const vis = begin2D(dt, '#100d14'), ctx = g2, lp = DPR / view2.s;
    overlay(pattern('brick' + DPR, brickTile));
    ctx.fillStyle = 'rgba(8, 24, 50, 0.5)'; ctx.fill(LAKE2.shore);
    tube(ctx, LAKE2.shore, NEON.cyan, 2.6 * lp, flick(1));
    tube(ctx, LAKE2.b2, NEON.blue, 1.5 * lp, flick(2));
    pads.forEach((p, i) => {
      const n = padLook[i];
      tube(ctx, () => { ctx.beginPath(); ctx.moveTo(p.x, p.z); ctx.arc(p.x, p.z, p.r, n + 0.35, n - 0.35 + TAU); ctx.closePath(); }, p.flower ? NEON.pink : NEON.green, 1.6 * lp, flick(10 + i));
    });
    trees.forEach((t, i) => {
      if (!vis(t.x, t.z)) return;
      tube(ctx, () => { ctx.beginPath(); ctx.arc(t.x, t.z, treeLook[i].r * 0.85, 0, TAU); }, treeLook[i].pink ? NEON.pink : NEON.green, 1.8 * lp, flick(30 + i));
    });
    rocks.forEach((r, i) => { if (vis(r.x, r.z)) tube(ctx, () => blobPath(ctx, r.x, r.z, r.s * 0.65, rockLook[i].k), NEON.purple, 1.6 * lp, flick(80 + i)); });
    ctx.save();
    ctx.translate(dockLand.x, dockLand.z); ctx.rotate(Math.atan2(dock.uz, dock.ux));
    tube(ctx, () => { ctx.beginPath(); ctx.rect(-0.25, -1.15, dock.len + 0.5, 2.3); }, NEON.yellow, 1.8 * lp, flick(99));
    ctx.restore();
    ctx.strokeStyle = '#a8ff7a'; ctx.lineWidth = 1.4 * lp; ctx.lineCap = 'round'; ctx.beginPath();
    for (const r of reeds) { const sw = Math.sin(time * 1.3 + r.ph) * 0.15; ctx.moveTo(r.x, r.z); ctx.lineTo(r.x + sw * r.h, r.z - r.h * 0.35); }

  function fabricTile(S) {
    return tile(S, S, (x, w, h) => {
      x.fillStyle = '#efe7d3'; x.fillRect(0, 0, w, h);
      x.fillStyle = 'rgba(150, 130, 95, 0.25)'; x.fillRect(0, 0, w, Math.max(1, w * 0.08)); x.fillRect(0, 0, Math.max(1, w * 0.08), h);

  function stitchRender(dt) {
    const S = Math.max(5, Math.round(buf.x / 130)), [lw, lh] = pixDraw(dt, S);
    const img = pix.lc.getImageData(0, 0, lw, lh).data;
    const ctx = g2;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = pattern('fabric' + S, () => fabricTile(S));
    ctx.fillRect(0, 0, buf.x, buf.y);
    const groups = new Map(), all = [];
    for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
      const o = (y * lw + x) * 4, key = (img[o] << 16) | (img[o + 1] << 8) | img[o + 2];
      if (STITCH_SKIP.has(key)) continue;
      let g = groups.get(key);
      if (!g) groups.set(key, g = []);
      g.push(x * S, y * S);
      all.push(x * S, y * S);
    }

      ctx.strokeStyle = hexStr(key);
      ctx.beginPath();
      for (let i = 0; i < pts.length; i += 2) { const x = pts[i], y = pts[i + 1]; ctx.moveTo(x + ins, y + ins); ctx.lineTo(x + S - ins, y + S - ins); ctx.moveTo(x + S - ins, y + ins); ctx.lineTo(x + ins, y + S - ins); }
      ctx.stroke();
    }
    // brilho da linha na perna de cima de cada X
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)'; ctx.lineWidth = S * 0.09;
    ctx.beginPath();
    for (let i = 0; i < all.length; i += 2) { const x = all[i], y = all[i + 1]; ctx.moveTo(x + S - ins * 1.4, y + ins * 1.6); ctx.lineTo(x + ins * 1.6, y + S - ins * 1.4); }

  function lumpy(geo, amt, freq, seed) {

    for (let i = 0; i < p.count; i++) {

      v.multiplyScalar(1 + n * amt);
      p.setXYZ(i, v.x, v.y, v.z);

    geo.computeVertexNormals();

  function clayInst(geo, list, place) {

  const gumWorld = new T.Group();

  const GUM_FLOOR = -1.65;
  const GUM_VS = `
    uniform float uTime;
    uniform float uWob;
    varying vec3 vN;
    varying vec3 vV;
    void main() {
      vec3 p = position + normal * sin(position.x * 5.0 + uTime * 9.0) * cos(position.z * 4.0 + uTime * 6.0) * uWob;
      vec4 wp = modelMatrix * vec4(p, 1.0);

    varying vec3 vN;

    pads.forEach((p, i) => sketchShape(ctx, th, circlePts(p.x, p.z, p.r, 12), th.pad, th.line, boil * 5 + i, 0.3, [p.x - p.r, p.z - p.r, p.x + p.r, p.z + p.r]));
    rocks.forEach((r, i) => { if (vis(r.x, r.z)) { const s = r.s * 0.7; sketchShape(ctx, th, circlePts(r.x, r.z, s, 9), th.rock, th.line, boil * 7 + i, 0.3, [r.x - s, r.z - s, r.x + s, r.z + s]); } });
    for (const f of foods) if (f.on) { ctx.fillStyle = th.fish; ctx.beginPath(); ctx.arc(f.x, f.z, 0.2, 0, TAU); ctx.fill(); }

  // ======================================================================
  // TERCEIRA LEVA: vitral, synthwave, cromo, ukiyo-e, terminal, raio-x, tricô, mosaico
  // ======================================================================
  const LAKE_GLSL = `
    float lakeR(float a) { return 1.0 + 0.10 * sin(3.0 * a + 0.7) + 0.06 * sin(5.0 * a + 2.1) + 0.035 * sin(7.0 * a + 4.0); }

  const VERT_UV = 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';

  // ---------- VITRAL: o lago todo em peças de vidro, calculado na placa de vídeo ----------
  const NT = Math.max(1, trees.length);
  const glassMat = new T.ShaderMaterial({
    uniforms: {
      uView: { value: new T.Vector3() }, uRes: { value: buf }, uTime: U.uTime, uFish: { value: new T.Vector4() },
      uPads: rayU.uPads, uFood: rayU.uFood,
      uTrees: { value: Array.from({ length: NT }, (_, i) => trees[i] ? new T.Vector3(trees[i].x, trees[i].z, treeLook[i].r) : new T.Vector3(999, 999, 0.1)) },
    },
    vertexShader: VERT,
    fragmentShader: `
      #define NP ${NP}
      #define NT ${NT}
      #define FS ${FISH_SIZE.toFixed(2)}
      uniform vec3 uView;
      uniform vec2 uRes;
      uniform float uTime;
      uniform vec4 uFish;
      uniform vec3 uPads[NP];
      uniform vec4 uFood[3];
      uniform vec3 uTrees[NT];
      varying vec2 vUv;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      ${LAKE_GLSL}
      // de que cor é o vidro neste ponto do mundo
      vec3 classify(vec2 p) {
        float c = cos(uFish.z), s = sin(uFish.z);
        vec2 q = p - uFish.xy;
        vec2 l = vec2(c * q.x - s * q.y, s * q.x + c * q.y) / FS;
        l.y -= sin(uFish.w - (1.45 - l.x) * 1.6) * 0.2 * clamp((1.45 - l.x) / 2.7, 0.0, 1.4);
        if ((l.x - 0.15) * (l.x - 0.15) / 1.8 + l.y * l.y / 0.3 < 1.0) return (l.x > 0.7 && abs(l.y) < 0.28) ? vec3(1.0, 0.93, 0.8) : vec3(1.0, 0.38, 0.08);
        if (l.x < -1.2 && l.x > -2.3 && abs(l.y) < (-1.2 - l.x) * 0.8 + 0.1) return vec3(1.0, 0.68, 0.25);
        for (int i = 0; i < 3; i++) if (uFood[i].w > 0.5 && distance(p, uFood[i].xz) < 0.45) return vec3(1.0, 0.82, 0.2);
        for (int i = 0; i < NP; i++) if (distance(p, uPads[i].xy) < uPads[i].z) return vec3(0.25, 0.72, 0.3);
        float v = lakeV(p);
        if (v < 1.0) return mix(vec3(0.1, 0.25, 0.75), vec3(0.3, 0.62, 0.95), smoothstep(0.2, 1.0, v));

      }
      void main() {
        vec2 px = vUv * uRes;

  // ---------- SYNTHWAVE: grade neon, lago espelhado e sol listrado no horizonte ----------
  const synthWorld = new T.Group();
  synthWorld.visible = false;
  scene.add(synthWorld);
  const fishSyn = new T.Group();
  fishSyn.visible = false;
  fish.add(fishSyn);
  const synth = { built: false, food: [] };
  const wire = (c) => new T.MeshBasicMaterial({ color: c, wireframe: true });
  function buildSynth() {
    if (synth.built) return;

    const floor = new T.Mesh(new T.PlaneGeometry(700, 700), new T.ShaderMaterial({
      uniforms: { uTime: U.uTime },
      vertexShader: waterMat.vertexShader,
      fragmentShader: `
        uniform float uTime;
        varying vec3 vW;
        ${LAKE_GLSL}
        float gl1(float x, float w) { float d = abs(fract(x + 0.5) - 0.5); return 1.0 - smoothstep(w * 0.5, w, d); }
        void main() {
          vec2 p = vW.xz;
          float v = lakeV(p), dist = length(p - cameraPosition.xz), w = 0.04 + dist * 0.0012;
          float g = max(gl1(p.x / 2.0, w), gl1(p.y / 2.0 + uTime * 0.3, w));
          vec3 c = vec3(0.07, 0.0, 0.13) + vec3(1.0, 0.17, 0.84) * g;
          if (v < 1.0) c = vec3(0.02, 0.0, 0.08) + vec3(0.09, 0.94, 1.0) * gl1(v * 7.0 - uTime * 0.4, 0.08) * 0.75;

    }));

    synth.horizon = new T.Group();
    synthWorld.add(synth.horizon);
    const sky = new T.Mesh(new T.PlaneGeometry(1400, 420), new T.ShaderMaterial({
      vertexShader: VERT_UV, depthWrite: false,
      fragmentShader: `
        varying vec2 vUv;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        void main() {
          vec3 c = mix(vec3(1.0, 0.25, 0.55) * 0.75, vec3(0.07, 0.0, 0.14), smoothstep(0.0, 0.55, vUv.y));
          c += step(0.997, hash(floor(vUv * vec2(700.0, 210.0)))) * smoothstep(0.3, 0.8, vUv.y);

    }));

    const sunD = new T.Mesh(new T.PlaneGeometry(170, 170), new T.ShaderMaterial({
      uniforms: { uTime: U.uTime }, vertexShader: VERT_UV,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        void main() {
          vec2 q = vUv - 0.5;
          if (length(q) > 0.5) discard;
          float y = vUv.y;
          if (y < 0.47 && fract(y * 13.0 + uTime * 0.15) < (0.47 - y) * 1.9) discard;
          gl_FragColor = vec4(mix(vec3(1.0, 0.12, 0.55), vec3(1.0, 0.86, 0.25), y), 1.0);
        }`,
    }));

    synth.horizon.add(sky, sunD);
    const mr = mulberry32(9);
    for (let i = 0; i < 9; i++) {

      synth.horizon.add(m);
    }
    const inst = (geo, list, c, place) => {
      const m = new T.InstancedMesh(geo, wire(c), list.length);
      list.forEach((it, i) => { dummy.position.set(0, 0, 0); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1); place(it, dummy); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); });
      m.frustumCulled = false; synthWorld.add(m);

    inst(new T.ConeGeometry(1.4, 3.6, 6, 2), trees, 0x16f0ff, (t, d) => d.position.set(t.x, -2 + 1.8, t.z));
    inst(new T.OctahedronGeometry(0.8, 0), rocks, 0xa66bff, (r, d) => { d.position.set(r.x, r.wet ? WATER_Y : -1.4, r.z); d.scale.setScalar(r.s); });
    inst(new T.CircleGeometry(1, 14).rotateX(-Math.PI / 2), pads, 0x3dff7a, (p, d) => { d.position.set(p.x, WATER_Y, p.z); d.scale.set(p.r, 1, p.r); });
    for (let i = 0; i < foods.length; i++) { const m = new T.Mesh(new T.OctahedronGeometry(0.28, 0), wire(0xffd23f)); synthWorld.add(m); synth.food.push(m); }

    fin.rotation.z = Math.PI / 2; fin.scale.set(1, 1, 0.25); fin.position.x = -0.45;

  const synthHide = [voxelWorld, reedMesh, weedMesh, headMesh, bubMesh, foodMesh, water];
  function synthEnter() {

    vecShow.uniforms.tIn.value = rtScene.texture;

  // ---------- CROMO HOLOGRÁFICO: o mundo arredondado em metal que muda de cor ----------
  const HOLO_VS = `
    varying vec3 vN;
    varying vec3 vV;
    varying vec3 vW;
    void main() {
      mat4 m = modelMatrix;
      #ifdef USE_INSTANCING
        m = m * instanceMatrix;
      #endif
      vec4 wp = m * vec4(position, 1.0);
      vN = normalize((m * vec4(normal, 0.0)).xyz);
      vV = cameraPosition - wp.xyz;
      vW = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`;
  function holoMaterial(dark, alpha = 1) {
    return new T.ShaderMaterial({
      uniforms: { uTime: U.uTime, uDark: { value: dark }, uAlpha: { value: alpha } },
      vertexShader: HOLO_VS, transparent: alpha < 1, depthWrite: alpha >= 1,
      fragmentShader: `
        uniform float uTime;
        uniform float uDark;
        uniform float uAlpha;
        varying vec3 vN;
        varying vec3 vV;
        varying vec3 vW;
        vec3 spectrum(float t) { return 0.5 + 0.5 * cos(6.2831 * (t + vec3(0.0, 0.33, 0.67))); }
        void main() {
          vec3 n = normalize(vN), v = normalize(vV), r = reflect(-v, n);

    });
  }
  const holo = { obj: holoMaterial(0), ground: holoMaterial(0.96), water: holoMaterial(0.4, 0.55), saved: new Map() };
  function holoSwap(on) {
    for (const root of [celWorld, fishCel]) root.traverse((o) => {
      if (!o.isMesh) return;
      if (on) {
        holo.saved.set(o, [o.material, o.visible]);

      } else if (holo.saved.has(o)) {

        o.material = m; o.visible = vis;
      }
    });
    if (!on) holo.saved.clear();
  }
  function holoEnter() { celEnter(); holoSwap(true); water.material = holo.water; renderer.setClearColor(0x0b0b12, 0); }
  function holoExit() { holoSwap(false); celExit(); }
  function holoRender(dt) {
    copyInst(cel.reeds, reedMesh); copyInst(cel.weeds, weedMesh); copyInst(cel.heads, headMesh);
    copyInst(cel.bub, bubMesh); copyInst(cel.food, foodMesh);
    renderWorld();
    finish(rtScene.texture, 0.4, 0);
  }

  // ---------- UKIYO-E: xilogravura japonesa ----------
  const UK = { paper: '#efe2c4', ink: '#1d1a20', blue: '#1f3f73', foam: '#f4ead2', red: '#c8402b', green: '#4f7a4a', green2: '#7a9a5a', sand: '#d9b97a', koi: '#e0552b' };
  let seigaiha = null;
  function seigaihaTile(R) {
    return tile(R * 2, R, (x, w, h) => {
      x.fillStyle = UK.blue; x.fillRect(0, 0, w, h);
      for (const [cx, cy] of [[0, 0], [w, 0], [w / 2, h / 2], [0, h], [w, h]]) {
        for (let k = 4; k >= 1; k--) {
          x.beginPath(); x.arc(cx, cy, R * k / 4.2, 0, TAU);
          x.fillStyle = k % 2 ? UK.foam : UK.blue; x.fill();
        }

    });
  }
  function ukiyoRender(dt) {
    const vis = begin2D(dt, UK.paper), ctx = g2, lp = DPR / view2.s, [bx0, bz0, bx1, bz1] = vis.box;
    overlay(pattern('paper4', () => grain(0.07, 61)));
    ctx.fillStyle = 'rgba(122, 154, 90, 0.35)'; ctx.fillRect(bx0, bz0, bx1 - bx0, bz1 - bz0);
    ctx.lineCap = ctx.lineJoin = 'round';
    for (const p of PATHS) { polyline(ctx, p); ctx.strokeStyle = UK.ink; ctx.lineWidth = 2.0; ctx.stroke(); ctx.strokeStyle = UK.sand; ctx.lineWidth = 2.0 - 4 * lp; ctx.stroke(); }
    ctx.fillStyle = UK.sand; ctx.fill(LAKE2.sand);
    ctx.strokeStyle = UK.ink; ctx.lineWidth = 2 * lp; ctx.stroke(LAKE2.sand);
    // água em ondas de escamas (seigaiha)
    const R = Math.round(view2.s * 1.1);
    if (!seigaiha || seigaiha.R !== R) seigaiha = { R, p: g2.createPattern(seigaihaTile(R), 'repeat') };
    ctx.save();
    ctx.clip(LAKE2.shore);
    const [ox, oy] = toScreen2D(0, 0);
    seigaiha.p.setTransform(new DOMMatrix([1, 0, 0, 1, ox % (R * 2), oy % R]));
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 0.92; ctx.fillStyle = seigaiha.p; ctx.fillRect(0, 0, buf.x, buf.y);

  // ---------- TERMINAL VERDE: o jogo inteiro em texto, num monitor de fósforo ----------
  const term = { key: '' };
  // tipos: 0 grama, 1 água, 2 água funda, 3 areia, 4 trilha, 5 árvore, 6 pedra, 7 folha d'água, 8 píer, 9 flor
  function termMap(cellW, cellH) {
    const key = cellW.toFixed(4) + ':' + cellH.toFixed(4);

    const cols = Math.ceil((X1 - X0) / cellW), rows = Math.ceil((Z1 - Z0) / cellH), m = new Uint8Array(cols * rows);

      let t = v < 0.6 ? 2 : v < 1 ? 1 : v < 1.13 ? 3 : isPath(x, z) ? 4 : 0;
      const dx = x - dockLand.x, dz = z - dockLand.z, s = dx * dock.ux + dz * dock.uz, q = -dx * dock.uz + dz * dock.ux;
      if (s > -0.3 && s < ds + 0.3 && Math.abs(q) < 1.15) t = 8;

    const oi = Math.round((view2.x - X0) / term.cellW - cols / 2), oj = Math.round((view2.z - Z0) / term.cellH - rows / 2);

  // ---------- TRICÔ e MOSAICO ROMANO: o mundo de pixel art feito de lã ou de pedrinhas ----------
  function groupCells(img, lw, lh, S, levels) {
    const groups = new Map();
    for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {

      let r = img[o], g = img[o + 1], b = img[o + 2];

        r = Math.min(255, r * k) | 0; g = Math.min(255, g * k) | 0; b = Math.min(255, b * k) | 0;
      }
      const key = (r << 16) | (g << 8) | b;
      let arr = groups.get(key);
      if (!arr) groups.set(key, arr = []);
      arr.push(x * S, y * S, x, y);
    }
    return groups;
  }

    { name: 'Low poly isométrico', group: 'Outros motores 3D', native: true, desc: 'Outro cenário, todo facetado em tons pastel, visto de lado como uma maquete.', enter: lowEnter, exit: lowExit, render: plain },
    { name: 'Nanquim japonês', group: 'Feito à mão', native: true, twoD: true, desc: 'Pinceladas de tinta preta em papel de arroz, a carpa em vermelhão e um selo de carimbo no canto.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: sumiRender },
    { name: 'Papel recortado', group: 'Feito à mão', native: true, twoD: true, desc: 'Folhas de papel empilhadas, uma para cada profundidade, com sombra entre as camadas. O peixe é um recorte.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: paperRender },
    { name: 'Giz de cera', group: 'Feito à mão', native: true, twoD: true, desc: 'Desenho de criança: rabiscos de giz de cera, contornos tremidos e um sol no canto.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: (dt) => sketchRender(dt, SKETCH.crayon) },
    { name: 'Lousa de giz', group: 'Feito à mão', native: true, twoD: true, desc: 'O lago desenhado a giz num quadro-negro, com poeira de giz e moldura de madeira.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: (dt) => sketchRender(dt, SKETCH.chalk) },
    { name: 'Ukiyo-e', group: 'Feito à mão', native: true, twoD: true, desc: 'Xilogravura japonesa: água em ondas de escamas, contornos de entalhe, nuvens em faixa e cartela vermelha.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: ukiyoRender },
    { name: 'Mosaico romano', group: 'Feito à mão', native: true, twoD: true, desc: 'Pedrinhas quadradas assentadas à mão em argamassa clara, cada uma um pouco torta e de um tom diferente.', init: pixInit, enter: () => twoDEnter(pixToWorld), exit: twoDExit, render: mosaicRender },
    { name: 'Planta técnica', group: 'Design e gráficos', native: true, twoD: true, desc: 'O lago como projeto de engenharia: grade, cotas, curvas de nível e uma etiqueta que mede o peixe ao vivo.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: blueRender },
    { name: 'Mapa antigo', group: 'Design e gráficos', native: true, twoD: true, desc: 'Pergaminho com linhas de costa, rosa dos ventos, trilha pontilhada e "aqui há peixes" seguindo a carpa.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: mapRender },
    { name: 'Bauhaus', group: 'Design e gráficos', native: true, twoD: true, desc: 'Composição geométrica em vermelho, amarelo, azul e preto: círculos, meias-luas e triângulos.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: bauhausRender },
    { name: 'Quadrinhos', group: 'Design e gráficos', native: true, twoD: true, desc: 'Pop art de gibi: retícula de pontos, contorno grosso, linhas de velocidade e "NHAC!" quando o peixe come.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: comicRender },
    { name: 'Letreiro neon', group: 'Design e gráficos', native: true, twoD: true, desc: 'Tubos de neon numa parede de tijolos: o lago, o peixe e as árvores brilham e às vezes piscam.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: neonRender },
    { name: 'Bala de goma', group: 'Materiais 3D', native: true, desc: 'Peixe de goma translúcida, com casca colorida sobre miolo leitoso, num estúdio claro com sombras coloridas. Ele amassa e balança como gelatina.', enter: gumEnter, exit: gumExit, render: gumRender },
    { name: 'Massinha', group: 'Materiais 3D', native: true, desc: 'Tudo modelado em massinha, com olhos esbugalhados, animado a 12 quadros por segundo como stop-motion.', enter: clayEnter, exit: clayExit, render: clayRender },
    { name: 'Blocos de montar', group: 'Materiais 3D', native: true, desc: 'O mundo de blocos virou brinquedo de montar: plástico brilhante e um pino em cima de cada peça.', enter: brickEnter, exit: brickExit, render: brickRender },
    { name: 'Origami', group: 'Materiais 3D', native: true, desc: 'Um diorama de papel dobrado: chão em sanfona, lago em camadas de papel, árvores em pirâmide e uma carpa de origami com vincos.', enter: oriEnter, exit: oriExit, render: oriRender },
    { name: 'Mármore e ouro', group: 'Materiais 3D', native: true, desc: 'O mundo arredondado esculpido em mármore com veios, sobre pedra escura, e a carpa como estátua de ouro.', enter: marbleEnter, exit: marbleExit, render: marbleRender },
    { name: 'Vitral', group: 'Luz e vidro', native: true, desc: 'O lago inteiro montado em peças de vidro colorido com chumbo entre elas, e a luz passando. Calculado direto na placa de vídeo.', enter: glassEnter, exit: glassExit, render: glassRender },
    { name: 'Cromo holográfico', group: 'Luz e vidro', native: true, desc: 'O mundo arredondado em metal espelhado que muda de cor conforme o ângulo, como bolha de sabão.', enter: holoEnter, exit: holoExit, render: holoRender },
    { name: 'Raio-X', group: 'Luz e vidro', native: true, twoD: true, desc: 'Tudo translúcido em filme de raio-x: nervuras nas folhas, galhos nas árvores e o esqueleto do peixe brilhando.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: xrayRender },
    { name: 'Silhueta ao pôr do sol', group: 'Luz e vidro', native: true, twoD: true, desc: 'Contra a luz: tudo vira silhueta preta, e só a água brilha, refletindo o céu laranja com o sol no meio.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: duskRender },
    { name: 'Câmera térmica', group: 'Luz e vidro', native: true, twoD: true, desc: 'Visão infravermelha: o peixe é a coisa mais quente do lago, as pedras guardam o calor do sol e a água é fria.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: heatRender },
    { name: 'Synthwave', group: 'Retrô', native: true, desc: 'Anos 80: grade neon, lago espelhado com anéis, montanhas de arame e um sol listrado no horizonte, com câmera baixa.', enter: synthEnter, exit: synthExit, render: synthRender },
    { name: 'Terminal verde', group: 'Retrô', native: true, twoD: true, desc: 'O jogo inteiro em texto num monitor de fósforo verde: ~ é água, & é árvore e o peixe é ><(((°>.', enter: () => twoDEnter(flatToWorld), exit: twoDExit, render: termRender },
    { name: 'Tinta na água', group: 'Física', desc: 'Um fluido de verdade: o peixe solta tinta colorida que gira e se espalha.', init: flInit, screen: true, render: flRender },
    { name: 'Gelatina', group: 'Física', desc: 'A imagem inteira presa numa malha de molas. O peixe empurra e tudo balança.', init: jellyInit, screen: true, render: jellyRender },
  ];

  // reações ao peixe comer, em alguns estilos
  eatHooks.push((f) => {
    if (cur && cur.render === celRender) celStars(f);
    if (cur && cur.twoD) rings2.push({ x: f.x, z: f.z, t: 0, big: 1.2 });
    if (cur && cur.render === comicRender) comic.pops.push({ x: f.x, z: f.z - 1, t: 0, txt: 'NHAC!', c: '#ffe14d' });
    if (cur && cur.render === gumRender) gum.sqv += 30;
    toScreen(f.x, f.y, f.z, tmpS);
    if (cur && cur.render === flRender) fl.burst = { x: tmpS.x / buf.x, y: tmpS.y / buf.y };
    if (cur && cur.render === jellyRender) jelly.kicks.push({ x: tmpS.x / buf.x * 2 - 1, y: tmpS.y / buf.y * 2 - 1 });
    if (cur && cur.render === sandRender) sand.queue.push({ x: tmpS.x, y: tmpS.y });
  });

  // ---------- aba de estilos ----------
  const listEl = document.getElementById('styleList'), stylesEl = document.getElementById('styles'), toggleEl = document.getElementById('stylesToggle');
  const numEl = document.getElementById('styleNum'), nameEl = document.getElementById('styleName'), descEl = document.getElementById('styleDesc');
  const noteEl = document.getElementById('note'), sizeRow = document.getElementById('sizeRow'), cellInput = document.getElementById('cell');
  const narrow = () => window.matchMedia('(max-width: 720px)').matches;
  document.getElementById('styleCount').textContent = MODES.length;
  const btns = [];
  let lastGroup = '';
  MODES.forEach((m, i) => {
    if (m.group !== lastGroup) {
      const h = document.createElement('h2');
      h.textContent = m.group;
      listEl.appendChild(h);
      lastGroup = m.group;
    }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'style-btn'; b.setAttribute('aria-pressed', 'false');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = String(i + 1).padStart(2, '0');
    const t = document.createElement('span'); t.textContent = m.name;
    b.append(n, t);
    if (m.native) { const g = document.createElement('span'); g.className = 'tag'; g.textContent = 'própria'; b.append(g); }
    b.addEventListener('click', () => { setMode(i); b.blur(); if (narrow()) setPanel(false); });
    listEl.appendChild(b);
    btns.push(b);
    if (m.cell) m.cellCss = m.cell[2];
  });
  function setPanel(open) {
    stylesEl.classList.toggle('closed', !open);
    toggleEl.setAttribute('aria-expanded', String(open));
  }
  toggleEl.addEventListener('click', () => setPanel(stylesEl.classList.contains('closed')));
  setPanel(!narrow());

  let cur = null, curIndex = 0, noteTimer = 0;
  function showNote(msg) {
    noteEl.textContent = msg; noteEl.hidden = false;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { noteEl.hidden = true; }, 7000);
  }
  function applyCell() {
    if (!cur || !cur.cell) return;
    U.uCell.value = Math.max(2, Math.round(cur.cellCss * DPR));
    if (cur.onCell) cur.onCell();
  }
  function setMode(i) {
    i = (i + MODES.length) % MODES.length;
    const m = MODES[i];
    if (m === cur) return;
    if (m.init && !m.ready) {
      let ok = false;
      try { ok = m.init() !== false; } catch (e) { ok = false; }
      if (!ok) { showNote(`O estilo ${m.name} precisa de um recurso de vídeo que este aparelho não tem.`); return; }
      m.ready = true;
    }
    if (cur && cur.exit) cur.exit();
    cur = m; curIndex = i;
    if (m.enter) m.enter();
    btns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
    if (!stylesEl.classList.contains('closed')) btns[i].scrollIntoView({ block: 'nearest' });
    numEl.textContent = String(i + 1).padStart(2, '0');
    nameEl.textContent = m.name;
    descEl.textContent = m.desc;
    document.getElementById('styleTag').hidden = !m.native;
    sizeRow.hidden = !m.cell;
    if (m.cell) { cellInput.min = m.cell[0]; cellInput.max = m.cell[1]; cellInput.value = m.cellCss; applyCell(); }
    try { localStorage.setItem('lago-estilo', String(i)); } catch (_) {}
  }
  cellInput.addEventListener('input', () => { if (cur && cur.cell) { cur.cellCss = +cellInput.value; applyCell(); } });

  window.addEventListener('keydown', (e) => {
    if (e.target === cellInput) return;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'KeyQ') { if (!e.repeat) setMode(curIndex - 1); return; }
    if (e.code === 'KeyE') { if (!e.repeat) setMode(curIndex + 1); return; }
    keys.add(e.code);
  });
  window.addEventListener('keyup', (e) => keys.delete(e.code));
  window.addEventListener('blur', () => keys.clear());
  canvas.addEventListener('pointerdown', () => {
    if (cur && cur.music && music.ctx && music.ctx.state !== 'running') music.ctx.resume();
  });

  // ---------- tamanho da tela ----------
  function resizeOne(rt, scale) {
    const k = sized.findIndex(s => s[0] === rt);
    if (k >= 0) sized[k][1] = scale;
    rt.setSize(Math.max(1, Math.round(buf.x * scale)), Math.max(1, Math.round(buf.y * scale)));
  }
  function resize() {
    const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    aspect = w / h;
    renderer.setSize(w, h, false);
    renderer.getDrawingBufferSize(buf);
    for (const [rt, s] of sized) rt.setSize(Math.max(1, Math.round(buf.x * s)), Math.max(1, Math.round(buf.y * s)));
    camera.aspect = aspect; camera.updateProjectionMatrix();
    camScale = clamp(0.8 / aspect, 1, 1.55);
    follow = activeCam === isoCam ? 0.9 : (aspect < 1 ? 0.92 : 0.55);
    sizeIso();
    if (!c2.hidden) { c2.width = buf.x; c2.height = buf.y; }
    for (const m of MODES) {
      if (!m.screen || !m.ready) continue;
      if (m === cur) m.init(); else m.ready = false;
    }
    applyCell();
  }
  window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('800 16px "JetBrains Mono"'), document.fonts.load('700 16px "Bricolage Grotesque"')]).then(applyCell, () => {});
  }

  // ---------- laço principal ----------
  let last = performance.now(), osdSec = -1;
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    U.uTime.value = time;
    if (cur.osd && Math.floor(time) !== osdSec) {
      osdSec = Math.floor(time);
      const d = new Date();
      osdTime.textContent = `${String(d.getDate()).padStart(2, '0')} ${MESES[d.getMonth()]} ${d.getFullYear()}  ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
    }
    cur.render(dt);
    requestAnimationFrame(frame);
  }

  // Mantém placar, peixe e estilo quando a página é atualizada com o jogo aberto.
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    hot.snapshot(() => ({ score, x: F.x, z: F.z, heading: F.heading, mode: curIndex }));
  }
  function start(data) {
    data = data || {};
    if (Number.isFinite(data.score)) { score = data.score; scoreEl.textContent = score; }
    if (Number.isFinite(data.x) && Number.isFinite(data.z)) { F.x = data.x; F.z = data.z; }
    if (Number.isFinite(data.heading)) F.heading = data.heading;
    resize();
    camT.set(F.x * follow, 0, F.z * follow + 1.5);
    placeCamera();
    let initial = 1;
    try { const s = parseInt(localStorage.getItem('lago-estilo'), 10); if (s >= 0 && s < MODES.length) initial = s; } catch (_) {}
    if (Number.isFinite(data.mode)) initial = data.mode;
    if (MODES[initial] && MODES[initial].music) initial = 1;  // o som só começa com um clique
    setMode(initial);
    if (!cur) setMode(0);
    requestAnimationFrame(frame);
  }
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start(hot && hot.data);
})();
</script>
